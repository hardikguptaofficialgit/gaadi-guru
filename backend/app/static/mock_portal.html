<!doctype html><html><head><meta charset="utf-8"><title>Municipal Grievance Portal (MOCK)</title>
<style>
:root{--ink:#1f2430;--ink2:#5b6474;--accent:#3f6fd8;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.85)}
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#e6eaf0;margin:0;color:var(--ink)}
.blob{position:fixed;z-index:-1;border-radius:50%}
header{max-width:820px;margin:24px auto 0;padding:16px 24px;font-size:18px;font-weight:700;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 16px rgba(120,130,150,.14)}
header small{font-weight:500;color:var(--ink2)}
.b{max-width:820px;margin:16px auto 40px;padding:28px 32px;border-radius:28px;background:rgba(255,255,255,.45);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:10px 10px 24px rgba(166,175,190,.4),-10px -10px 24px rgba(255,255,255,.8)}
label{display:block;margin-top:14px;font-weight:600;font-size:13px;color:var(--ink2)}
input,select,textarea{width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:14px;color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);outline:1px solid rgba(31,36,48,.08);outline-offset:-2px;border-radius:14px;box-shadow:0 1px 2px rgba(31,36,48,.06),0 6px 16px rgba(120,130,150,.14)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent)}
textarea{height:130px}.warn{background:rgba(242,184,75,.22);border:1px solid rgba(242,184,75,.5);border-radius:14px;padding:10px 14px;font-size:13px}
button{margin-top:20px;background:var(--accent);color:#fff;border:1px solid rgba(255,255,255,.35);padding:13px 26px;font:inherit;font-weight:650;font-size:15px;border-radius:16px;cursor:pointer;box-shadow:6px 6px 14px rgba(63,111,216,.28),-6px -6px 14px rgba(255,255,255,.8)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
</style></head>
<body><div class="blob" style="width:380px;height:380px;left:-80px;top:120px;background:#d6e0f5"></div><div class="blob" style="width:300px;height:300px;right:-60px;top:420px;background:#f3e3c4"></div><header>Municipal Corporation — Public Grievance Portal <small>(local mock for demo)</small></header>
<div class="b"><div class="warn">Demo mock of a civic complaint form. Nothing is sent anywhere.</div>
<form id="f" onsubmit="event.preventDefault();document.getElementById('done').textContent='SUBMITTED (mock)';">
<label>Citizen name<input name="name" id="name"></label>
<label>Mobile number<input name="mobile" id="mobile"></label>
<label>Ward / Zone<select name="ward" id="ward"><option value="">-- select --</option><option>Ward 1</option><option>Ward 7</option><option>Ward 12</option><option>Ward 23</option><option>Ward 41</option></select></label>
<label>Category<select name="category" id="category"><option value="">-- select --</option><option>Streetlight</option><option>Garbage</option><option>Roads &amp; Potholes</option><option>Water logging</option><option>Drainage</option></select></label>
<label>Location (lat, lng or landmark)<input name="location" id="location"></label>
<label>Subject<input name="subject" id="subject"></label>
<label>Description<textarea name="description" id="description"></textarea></label>
<label>Severity<select name="severity" id="severity"><option value="">-- select --</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label>
<button id="submit" type="submit">Submit Grievance</button> <span id="done"></span>
</form></div></body></html>
